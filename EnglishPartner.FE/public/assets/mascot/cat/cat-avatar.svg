<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" aria-hidden="true">
  <!-- Subtle circular backdrop -->
  <circle cx="40" cy="40" r="38" fill="#e2f3ee" stroke="#6dbd9f" stroke-width="1.8" />
  
  <!-- Left Ear -->
  <path d="M 22,32 C 18,17 28,11 34,18 L 37,28 Z" fill="#ffffff" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 25,28 C 22,19 28,15 31,19 L 34,26 Z" fill="#ebdcc9" />

  <!-- Right Ear -->
  <path d="M 58,32 C 62,17 52,11 46,18 L 43,28 Z" fill="#ffffff" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 55,28 C 58,19 52,15 49,19 L 46,26 Z" fill="#ebdcc9" />

  <!-- Head -->
  <ellipse cx="40" cy="40" rx="22" ry="19.5" fill="#ffffff" stroke="#26443c" stroke-width="2.2" />

  <!-- Cheeks (Blush) -->
  <ellipse cx="26" cy="43.5" rx="4" ry="2.6" fill="#f7c5ba" opacity="0.9" />
  <ellipse cx="54" cy="43.5" rx="4" ry="2.6" fill="#f7c5ba" opacity="0.9" />

  <!-- Whiskers -->
  <path d="M 18,39 L 26,41 M 17,44 L 25,44" stroke="#54675f" stroke-width="1.2" stroke-linecap="round" />
  <path d="M 62,39 L 54,41 M 63,44 L 55,44" stroke="#54675f" stroke-width="1.2" stroke-linecap="round" />

  <!-- Eyes -->
  <ellipse cx="32" cy="37.5" rx="3.4" ry="4.6" fill="#26443c" />
  <circle cx="30.8" cy="35.5" r="1.5" fill="#ffffff" />
  <ellipse cx="48" cy="37.5" rx="3.4" ry="4.6" fill="#26443c" />
  <circle cx="46.8" cy="35.5" r="1.5" fill="#ffffff" />

  <!-- Nose & Mouth -->
  <polygon points="38.5,43 41.5,43 40,45" fill="#e88d8d" />
  <path d="M 37,46.2 Q 40,48.2 40,45.8 Q 40,48.2 43,46.2" stroke="#26443c" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Neckerchief -->
  <path d="M 28,55 Q 40,61 52,55 L 40,68 Z" fill="#4fa685" stroke="#26443c" stroke-width="2" stroke-linejoin="round" />
  <!-- Neckerchief Knot -->
  <circle cx="40" cy="57" r="3" fill="#6dbd9f" stroke="#26443c" stroke-width="1.6" />
</svg>
