<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <!-- Review Flashcard base -->
  <rect x="3.5" y="4.5" width="17" height="15" rx="3.5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8" />
  
  <!-- Subtle header line inside card -->
  <line x1="7" y1="7.5" x2="17" y2="7.5" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round" />

  <!-- Dual SRS Recall Arrows: Top Emerald / Bottom Amber -->
  <path d="M 15.5,10.8 A 3.8 3.8 0 0 0 8.5,9.8" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" />
  <polygon points="7,7.8 8.8,11 6,11.4" fill="#10b981" />

  <path d="M 8.5,13.2 A 3.8 3.8 0 0 0 15.5,14.2" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />
  <polygon points="17,16.2 15.2,13 18,12.6" fill="#f59e0b" />
</svg>
