<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <!-- Calendar Page Base -->
  <rect x="3" y="4" width="18" height="17" rx="3.5" fill="#fff5f5" stroke="#f43f5e" stroke-width="1.8" />
  
  <!-- Calendar Header Band -->
  <path d="M 3,7.5 C 3,5.6 4.5,4 6.5,4 L 17.5,4 C 19.5,4 21,5.6 21,7.5 L 21,9 L 3,9 Z" fill="#f43f5e" />
  
  <!-- Top Binder Rings -->
  <rect x="7" y="2" width="2" height="4" rx="1" fill="#be123c" />
  <rect x="15" y="2" width="2" height="4" rx="1" fill="#be123c" />

  <!-- Sun in center (Today's date) -->
  <circle cx="12" cy="15" r="2.8" fill="#f59e0b" />
  <circle cx="12" cy="15" r="4.6" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.5 2" />
