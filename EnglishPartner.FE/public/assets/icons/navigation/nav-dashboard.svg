  <line x1="5" y1="18" x2="5" y2="15.5" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
  <line x1="7" y1="18" x2="7" y2="14" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" />
  <line x1="9" y1="18" x2="9" y2="16.5" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />

  <!-- Dashboard Card 4 (Bottom Right Settings/Live Pulse Widget) -->
