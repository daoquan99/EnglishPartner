  <path d="M 15 10 L 17 7.5 L 19 8.5" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dashboard Card 3 (Bottom Left Bar Chart Widget) -->
