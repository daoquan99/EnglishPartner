<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <!-- Rounded Base Soundwave Chamber -->
  <rect x="2.5" y="4.5" width="6.5" height="15" rx="3.25" fill="#e2f3ee" stroke="#059669" stroke-width="1.8" />
  <circle cx="5.75" cy="12" r="1.5" fill="#047857" />

  <!-- Radiating Audio Voice Soundwaves in Gradient-like Tones -->
  <!-- Wave 1 (Inner Teal) -->
  <path d="M 12 7.5 C 13.5 9 14.2 10.5 14.2 12 C 14.2 13.5 13.5 15 12 16.5" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" />

  <!-- Wave 2 (Middle Azure) -->
  <path d="M 15.5 5 C 18 7.5 19 9.8 19 12 C 19 14.2 18 16.5 15.5 19" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" />

  <!-- Wave 3 (Outer Coral Highlight) -->
  <path d="M 19 3 C 21.8 6 22.8 8.8 22.8 12 C 22.8 15.2 21.8 18 19 21" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round" />
</svg>
