<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none" aria-hidden="true">
  <!-- Ground Shadow -->
  <ellipse cx="120" cy="180" rx="95" ry="12" fill="#e2f3ee" />

  <!-- Floating / scattered vocabulary cards on left -->
  <g class="vocabulary-cards">
    <rect x="36" y="112" width="42" height="30" rx="4" transform="rotate(-12 57 127)" fill="#ffffff" stroke="#26443c" stroke-width="1.8" />
    <line x1="43" y1="124" x2="68" y2="120" stroke="#4fa685" stroke-width="1.4" stroke-linecap="round" />
    <line x1="44" y1="130" x2="62" y2="126" stroke="#54675f" stroke-width="1.2" stroke-linecap="round" />

    <rect x="46" y="132" width="46" height="32" rx="4" transform="rotate(8 69 148)" fill="#ffffff" stroke="#26443c" stroke-width="2" />
    <line x1="56" y1="145" x2="82" y2="149" stroke="#4fa685" stroke-width="1.4" stroke-linecap="round" />
    <line x1="57" y1="152" x2="76" y2="155" stroke="#54675f" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Tail on right -->
  <path d="M 152,152 C 178,148 188,128 180,116 C 175,108 166,112 168,120 C 170,129 158,138 146,143" stroke="#26443c" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M 152,152 C 178,148 188,128 180,116 C 175,108 166,112 168,120 C 170,129 158,138 146,143" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Body -->
  <path d="M 96,122 C 90,136 94,168 104,172 C 117,176 142,176 154,172 C 163,168 164,136 156,122 Z" fill="#ffffff" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
  <ellipse cx="110" cy="172" rx="8.5" ry="5.5" fill="#ffffff" stroke="#26443c" stroke-width="2" />
  <ellipse cx="144" cy="172" rx="8.5" ry="5.5" fill="#ffffff" stroke="#26443c" stroke-width="2" />

  <!-- Left Ear -->
  <path d="M 98,64 C 92,44 104,35 114,45 L 118,58 Z" fill="#ffffff" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 102,58 C 98,46 105,40 110,46 L 114,55 Z" fill="#ebdcc9" />

  <!-- Right Ear -->
  <path d="M 148,65 C 154,45 142,35 132,45 L 128,58 Z" fill="#ffffff" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 144,59 C 148,47 141,41 136,47 L 132,56 Z" fill="#ebdcc9" />

  <!-- Head with slight inquisitive tilt -->
  <ellipse cx="124" cy="78" rx="31" ry="27" fill="#ffffff" stroke="#26443c" stroke-width="2.2" />

  <!-- Cheeks -->
  <ellipse cx="104" cy="85" rx="5.5" ry="3.8" fill="#f7c5ba" opacity="0.85" />
  <ellipse cx="144" cy="85" rx="5.5" ry="3.8" fill="#f7c5ba" opacity="0.85" />

  <!-- Whiskers -->
  <path d="M 92,79 L 103,82 M 91,85 L 102,85" stroke="#54675f" stroke-width="1.3" stroke-linecap="round" />
  <path d="M 156,79 L 145,82 M 157,85 L 146,85" stroke="#54675f" stroke-width="1.3" stroke-linecap="round" />

  <!-- Eyes: wide, curious searching glance toward left/magnifier -->
  <ellipse cx="112" cy="75" rx="5.2" ry="6.2" fill="#26443c" />
  <circle cx="109.5" cy="72.5" r="2.2" fill="#ffffff" />
  <ellipse cx="134" cy="75" rx="4.5" ry="5.8" fill="#26443c" />
  <circle cx="131.5" cy="72.5" r="1.8" fill="#ffffff" />

  <!-- Nose & Mouth (small "o" of curiosity) -->
  <polygon points="121,83 125,83 123,86" fill="#e88d8d" />
  <ellipse cx="123" cy="89" rx="2" ry="2.5" fill="none" stroke="#26443c" stroke-width="1.8" />

  <!-- Neckerchief -->
  <path d="M 108,100 Q 124,109 142,100 L 124,119 Z" fill="#4fa685" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
  <circle cx="124" cy="103" r="3.2" fill="#6dbd9f" stroke="#26443c" stroke-width="1.6" />

  <!-- Left Paw holding Magnifying Glass -->
  <g class="magnifier-tool">
    <!-- Magnifier Lens Frame -->
    <circle cx="82" cy="98" r="18" fill="#e2f3ee" fill-opacity="0.6" stroke="#26443c" stroke-width="2.5" />
    <!-- Glass sheen -->
    <path d="M 72,90 A 13 13 0 0 1 92,90" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Handle -->
    <path d="M 95,110 L 112,126" stroke="#4fa685" stroke-width="5" stroke-linecap="round" />
    <path d="M 95,110 L 112,126" stroke="#26443c" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Left Paw wrapping handle -->
    <ellipse cx="104" cy="119" rx="6.5" ry="5" fill="#ffffff" stroke="#26443c" stroke-width="2" />
  </g>

  <!-- Right Paw resting on side -->
  <ellipse cx="148" cy="132" rx="6" ry="5" fill="#ffffff" stroke="#26443c" stroke-width="2" />

  <!-- Question mark / curiosity sparkle above -->
  <g class="curiosity-cue">
    <path d="M 172,45 C 172,39 177,35 183,35 C 189,35 193,39 193,44 C 193,48 189,51 185,54 L 185,58" stroke="#f4c442" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <circle cx="185" cy="65" r="1.5" fill="#f4c442" />
  </g>
</svg>
