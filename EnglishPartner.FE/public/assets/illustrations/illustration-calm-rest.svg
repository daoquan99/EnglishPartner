<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none" aria-hidden="true">
  <!-- Ground Shadow -->
  <ellipse cx="120" cy="175" rx="100" ry="12" fill="#e2f3ee" />

  <!-- Gentle "Zzz" / Rest floaters -->
  <g class="calm-zzz">
    <path d="M 180,48 L 192,48 L 180,60 L 192,60" stroke="#4fa685" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 198,34 L 206,34 L 198,42 L 206,42" stroke="#6dbd9f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 212,24 L 217,24 L 212,29 L 217,29" stroke="#93d5bd" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Closed Study Book resting on left -->
  <g class="closed-book">
    <path d="M 38,155 L 90,140 L 105,152 L 53,167 Z" fill="#4fa685" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M 38,155 L 38,162 L 53,174 L 105,159 L 105,152 L 53,167 Z" fill="#387a61" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
    <!-- Pages edge -->
    <path d="M 40,161 L 91,146 L 103,156 L 53,171 Z" fill="#ffffff" />
    <!-- Bookmark ribbon -->
    <path d="M 72,145 C 72,158 66,168 62,175 L 68,172 L 74,175 C 76,168 76,155 76,144 Z" fill="#f4c442" stroke="#26443c" stroke-width="1.2" />
  </g>

  <!-- Curled Sleeping Body -->
  <ellipse cx="140" cy="148" rx="42" ry="26" fill="#ffffff" stroke="#26443c" stroke-width="2.2" />

  <!-- Curled Tail wrapping around -->
  <path d="M 175,142 C 196,145 204,162 192,170 C 180,178 152,172 135,170" stroke="#26443c" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M 175,142 C 196,145 204,162 192,170 C 180,178 152,172 135,170" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Tucked Paws -->
  <ellipse cx="112" cy="158" rx="8" ry="5.5" fill="#ffffff" stroke="#26443c" stroke-width="2" />
  <ellipse cx="128" cy="158" rx="8" ry="5.5" fill="#ffffff" stroke="#26443c" stroke-width="2" />

  <!-- Resting Head tilted gently on paws -->
  <g transform="rotate(-6 112 118)">
    <!-- Left Ear -->
    <path d="M 88,102 C 80,84 92,75 102,84 L 106,96 Z" fill="#ffffff" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M 91,96 C 86,85 93,80 98,85 L 101,93 Z" fill="#ebdcc9" />

    <!-- Right Ear -->
    <path d="M 134,102 C 142,84 130,75 120,84 L 116,96 Z" fill="#ffffff" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M 131,96 C 136,85 129,80 124,85 L 121,93 Z" fill="#ebdcc9" />

    <!-- Head -->
    <ellipse cx="112" cy="118" rx="30" ry="25" fill="#ffffff" stroke="#26443c" stroke-width="2.2" />

    <!-- Blush Cheeks -->
    <ellipse cx="92" cy="123" rx="5.5" ry="3.5" fill="#f7c5ba" opacity="0.85" />
    <ellipse cx="132" cy="123" rx="5.5" ry="3.5" fill="#f7c5ba" opacity="0.85" />

    <!-- Whiskers -->
    <path d="M 80,118 L 92,120 M 79,124 L 91,123" stroke="#54675f" stroke-width="1.3" stroke-linecap="round" />
    <path d="M 144,118 L 132,120 M 145,124 L 133,123" stroke="#54675f" stroke-width="1.3" stroke-linecap="round" />

    <!-- Eyes: Calm Smiling Sleeping Curves -->
    <path d="M 98,114 Q 103,119 108,114" stroke="#26443c" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M 116,114 Q 121,119 126,114" stroke="#26443c" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Nose & Mouth -->
    <polygon points="110,121 114,121 112,124" fill="#e88d8d" />
    <path d="M 108,125 Q 112,128 112,125 Q 112,128 116,125" stroke="#26443c" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Mint Neckerchief -->
    <path d="M 98,138 Q 112,145 126,138 L 112,152 Z" fill="#4fa685" stroke="#26443c" stroke-width="2" stroke-linejoin="round" />
    <circle cx="112" cy="141" r="3" fill="#6dbd9f" stroke="#26443c" stroke-width="1.5" />
  </g>
</svg>
