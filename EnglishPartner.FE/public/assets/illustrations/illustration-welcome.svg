<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none" aria-hidden="true">
  <!-- Soft ground puddle / shadow -->
  <ellipse cx="120" cy="180" rx="90" ry="12" fill="#e2f3ee" />

  <!-- Welcoming speech bubble -->
  <g class="welcome-bubble">
    <path d="M 160,35 C 160,24 170,15 185,15 C 200,15 210,24 210,35 C 210,46 198,54 185,54 C 180,54 175,56 168,60 C 170,55 170,52 168,50 C 163,46 160,41 160,35 Z" fill="#ffffff" stroke="#26443c" stroke-width="2" stroke-linejoin="round" />
    <circle cx="178" cy="34" r="2.2" fill="#4fa685" />
    <circle cx="185" cy="34" r="2.2" fill="#4fa685" />
    <circle cx="192" cy="34" r="2.2" fill="#4fa685" />
  </g>

  <!-- Tail curled to the right -->
  <path d="M 148,150 C 172,148 185,130 178,115 C 174,106 165,110 166,118 C 168,128 156,138 144,142" stroke="#26443c" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M 148,150 C 172,148 185,130 178,115 C 174,106 165,110 166,118 C 168,128 156,138 144,142" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Body -->
  <path d="M 90,120 C 85,135 88,168 100,172 C 112,175 136,175 148,172 C 158,168 160,135 152,120 Z" fill="#ffffff" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Paws resting / body base -->
  <ellipse cx="106" cy="172" rx="9" ry="6" fill="#ffffff" stroke="#26443c" stroke-width="2" />
  <ellipse cx="138" cy="172" rx="9" ry="6" fill="#ffffff" stroke="#26443c" stroke-width="2" />

  <!-- Left Ear -->
  <path d="M 94,68 C 88,48 100,38 110,48 L 115,62 Z" fill="#ffffff" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 98,62 C 94,49 101,43 106,49 L 110,59 Z" fill="#ebdcc9" />

  <!-- Right Ear -->
  <path d="M 146,68 C 152,48 140,38 130,48 L 125,62 Z" fill="#ffffff" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 142,62 C 146,49 139,43 134,49 L 130,59 Z" fill="#ebdcc9" />

  <!-- Head -->
  <ellipse cx="120" cy="82" rx="32" ry="28" fill="#ffffff" stroke="#26443c" stroke-width="2.2" />

  <!-- Blush Cheeks -->
  <ellipse cx="99" cy="88" rx="6" ry="4" fill="#f7c5ba" opacity="0.85" />
  <ellipse cx="141" cy="88" rx="6" ry="4" fill="#f7c5ba" opacity="0.85" />

  <!-- Whiskers -->
  <path d="M 86,82 L 98,85 M 85,89 L 97,89" stroke="#54675f" stroke-width="1.4" stroke-linecap="round" />
  <path d="M 154,82 L 142,85 M 155,89 L 143,89" stroke="#54675f" stroke-width="1.4" stroke-linecap="round" />

  <!-- Eyes - Friendly Happy Curve -->
  <ellipse cx="108" cy="79" rx="4.5" ry="6" fill="#26443c" />
  <circle cx="106.5" cy="76" r="2" fill="#ffffff" />
  <ellipse cx="132" cy="79" rx="4.5" ry="6" fill="#26443c" />
  <circle cx="130.5" cy="76" r="2" fill="#ffffff" />

  <!-- Nose & Mouth -->
  <polygon points="118,87 122,87 120,90" fill="#e88d8d" />
  <path d="M 115,91 Q 120,94 120,91 Q 120,94 125,91" stroke="#26443c" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Neckerchief -->
  <path d="M 102,104 Q 120,113 138,104 L 120,123 Z" fill="#4fa685" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
  <circle cx="120" cy="107" r="3.5" fill="#6dbd9f" stroke="#26443c" stroke-width="1.8" />

  <!-- Right Waving Paw (up in greeting) -->
  <g class="waving-paw">
    <path d="M 148,110 C 160,98 175,90 178,100 C 180,107 168,120 154,124 Z" fill="#ffffff" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
    <!-- Paw pads -->
    <ellipse cx="170" cy="101" rx="3.5" ry="2.8" fill="#f7c5ba" />
    <circle cx="166" cy="96" r="1.3" fill="#f7c5ba" />
    <circle cx="171" cy="95" r="1.3" fill="#f7c5ba" />
    <circle cx="175" cy="98" r="1.3" fill="#f7c5ba" />
  </g>

  <!-- Open Study Book in front -->
  <g class="open-book">
    <path d="M 85,150 C 98,144 112,145 120,150 C 128,145 142,144 155,150 L 155,167 C 142,161 128,162 120,167 C 112,162 98,161 85,167 Z" fill="#ffffff" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
    <line x1="120" y1="150" x2="120" y2="167" stroke="#26443c" stroke-width="2" />
    <!-- Book lines / text suggestion -->
    <line x1="91" y1="154" x2="114" y2="154" stroke="#4fa685" stroke-width="1.2" stroke-linecap="round" />
    <line x1="91" y1="158" x2="110" y2="158" stroke="#54675f" stroke-width="1" stroke-linecap="round" />
    <line x1="126" y1="154" x2="149" y2="154" stroke="#4fa685" stroke-width="1.2" stroke-linecap="round" />
    <line x1="126" y1="158" x2="145" y2="158" stroke="#54675f" stroke-width="1" stroke-linecap="round" />
    <!-- Left Paw resting on book -->
    <ellipse cx="88" cy="148" rx="7" ry="5" fill="#ffffff" stroke="#26443c" stroke-width="2" />
  </g>

  <!-- Cheerful Sparkles -->
  <polygon points="58,60 61,66 67,69 61,72 58,78 55,72 49,69 55,66" fill="#f4c442" />
  <circle cx="48" cy="85" r="2.5" fill="#6dbd9f" />
</svg>
