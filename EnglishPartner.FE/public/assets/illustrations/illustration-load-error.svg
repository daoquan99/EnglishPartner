<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none" aria-hidden="true">
  <!-- Ground Shadow -->
  <ellipse cx="120" cy="180" rx="90" ry="12" fill="#e2f3ee" />

  <!-- Reconnect cloud with refresh arrow on top right -->
  <g class="reconnect-cue">
    <path d="M 160,42 C 160,32 168,26 177,26 C 184,26 190,30 193,35 C 196,33 200,33 203,36 C 208,40 208,46 205,50 C 205,56 200,60 193,60 L 168,60 C 161,60 156,55 156,48 C 156,45 158,43 160,42 Z" fill="#ffffff" stroke="#26443c" stroke-width="2" stroke-linejoin="round" />
    <!-- Curved refresh arrow inside cloud -->
    <path d="M 176,44 A 6 6 0 1 1 187,48" stroke="#4fa685" stroke-width="2" stroke-linecap="round" fill="none" />
    <polygon points="187,43 191,48 184,49" fill="#4fa685" />
  </g>

  <!-- Tail on left -->
  <path d="M 85,152 C 60,150 48,132 55,120 C 60,112 70,116 68,124 C 65,134 76,142 88,146" stroke="#26443c" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M 85,152 C 60,150 48,132 55,120 C 60,112 70,116 68,124 C 65,134 76,142 88,146" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Body -->
  <path d="M 94,122 C 88,136 92,168 102,172 C 115,176 139,176 150,172 C 160,168 160,136 152,122 Z" fill="#ffffff" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
  <ellipse cx="108" cy="172" rx="8.5" ry="5.5" fill="#ffffff" stroke="#26443c" stroke-width="2" />
  <ellipse cx="140" cy="172" rx="8.5" ry="5.5" fill="#ffffff" stroke="#26443c" stroke-width="2" />

  <!-- Left Ear -->
  <path d="M 96,66 C 90,46 102,36 112,46 L 117,60 Z" fill="#ffffff" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 100,60 C 96,47 103,41 108,47 L 112,57 Z" fill="#ebdcc9" />

  <!-- Right Ear -->
  <path d="M 148,66 C 154,46 142,36 132,46 L 127,60 Z" fill="#ffffff" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 144,60 C 148,47 141,41 136,47 L 132,57 Z" fill="#ebdcc9" />

  <!-- Head -->
  <ellipse cx="122" cy="80" rx="31" ry="27" fill="#ffffff" stroke="#26443c" stroke-width="2.2" />

  <!-- Blush Cheeks -->
  <ellipse cx="102" cy="86" rx="5.5" ry="3.8" fill="#f7c5ba" opacity="0.85" />
  <ellipse cx="142" cy="86" rx="5.5" ry="3.8" fill="#f7c5ba" opacity="0.85" />

  <!-- Whiskers -->
  <path d="M 90,80 L 101,83 M 89,86 L 100,86" stroke="#54675f" stroke-width="1.3" stroke-linecap="round" />
  <path d="M 154,80 L 143,83 M 155,86 L 144,86" stroke="#54675f" stroke-width="1.3" stroke-linecap="round" />

  <!-- Eyes: Soft reassuring smile curves -->
  <path d="M 107,77 Q 112,82 117,77" stroke="#26443c" stroke-width="2.4" stroke-linecap="round" fill="none" />
  <path d="M 127,77 Q 132,82 137,77" stroke="#26443c" stroke-width="2.4" stroke-linecap="round" fill="none" />

  <!-- Nose & Mouth (encouraging gentle smile) -->
  <polygon points="120,84 124,84 122,87" fill="#e88d8d" />
  <path d="M 117,89 Q 122,92 122,89 Q 122,92 127,89" stroke="#26443c" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Mint Neckerchief -->
  <path d="M 106,102 Q 122,111 140,102 L 122,121 Z" fill="#4fa685" stroke="#26443c" stroke-width="2.2" stroke-linejoin="round" />
  <circle cx="122" cy="105" r="3.2" fill="#6dbd9f" stroke="#26443c" stroke-width="1.6" />

  <!-- Paws in reassuring "We can try again!" pose -->
  <ellipse cx="106" cy="130" rx="7" ry="5.5" fill="#ffffff" stroke="#26443c" stroke-width="2" />
  <ellipse cx="138" cy="130" rx="7" ry="5.5" fill="#ffffff" stroke="#26443c" stroke-width="2" />

  <!-- Gentle little heart beside cloud for reassurance -->
  <path d="M 142,42 C 142,39 144,37 146.5,37 C 148,37 149.5,38 150,39.5 C 150.5,38 152,37 153.5,37 C 156,37 158,39 158,42 C 158,46 150,51 150,51 C 150,51 142,46 142,42 Z" fill="#f7c5ba" stroke="#26443c" stroke-width="1.4" />
</svg>
