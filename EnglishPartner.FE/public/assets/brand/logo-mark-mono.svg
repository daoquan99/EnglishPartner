<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Outer Badge Frame -->
  <rect x="2" y="2" width="44" height="44" rx="12" stroke="currentColor" stroke-width="2"/>
  
  <!-- Left Ear -->
  <path d="M 12,18 C 10,10 16,7 19,11 L 21,17 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 14,16 C 13,11 16.5,9.5 18,11.5 L 20,16 Z" fill="currentColor" fill-opacity="0.2"/>
  
  <!-- Right Ear -->
  <path d="M 36,18 C 38,10 32,7 29,11 L 27,17 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 34,16 C 35,11 31.5,9.5 30,11.5 L 28,16 Z" fill="currentColor" fill-opacity="0.2"/>
  
  <!-- Cat Head -->
  <ellipse cx="24" cy="24" rx="13" ry="11.5" stroke="currentColor" stroke-width="2"/>
  
  <!-- Eyes -->
  <ellipse cx="19" cy="22.5" rx="2" ry="2.8" fill="currentColor"/>
  <circle cx="18.3" cy="21.3" r="0.9" fill="#ffffff"/>
  <ellipse cx="29" cy="22.5" rx="2" ry="2.8" fill="currentColor"/>
  <circle cx="28.3" cy="21.3" r="0.9" fill="#ffffff"/>
  
  <!-- Nose & Smile -->
  <polygon points="23,25.8 25,25.8 24,27" fill="currentColor"/>
  <path d="M 22,27.8 Q 24,29.2 24,27.5 Q 24,29.2 26,27.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  <!-- Book -->
  <path d="M 11,35 Q 18,33 24,35.5 Q 30,33 37,35 L 36.5,41 Q 30,38.5 24,40.5 Q 18,38.5 11.5,41 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 24,35.5 L 24,40.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg>
